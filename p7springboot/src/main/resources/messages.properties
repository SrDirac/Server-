# Actividades (las claves que estan en el array del controlador)
exc01.titulo=Ruta histórica por Toledo
exc01.descripcion=Visita guiada por el casco antiguo, la catedral y la sinagoga de Santa María la Blanca, con comida incluida.
exc02.titulo=Senderismo otoñal en la sierra
exc02.descripcion=Ruta de dificultad baja-media de unos 10 km con guía de montaña e interpretación de la flora y fauna.
exc03.titulo=Visita al Acueducto y Alcázar de Segovia
exc03.descripcion=Excursión de un día con visita al Acueducto, el Alcázar y tiempo libre por el centro.
act01.titulo=Taller de pintura en acuarela
act01.descripcion=Taller para principiantes sobre técnicas básicas de acuarela. Se incluyen los materiales.
act02.titulo=Club de lectura mensual
act02.descripcion=Encuentro para comentar en grupo un libro elegido el mes anterior, con un moderador.
act03.titulo=Taller de cerámica navideña
act03.descripcion=Elaboración de adornos y figuras de barro para Navidad. Apto para familias.
act04.titulo=Ciclo de cine clásico
act04.descripcion=Proyección de una película clásica seguida de un coloquio sobre la obra y su contexto.
tor01.titulo=Torneo de ajedrez por categorías
tor01.descripcion=Competición por sistema suizo, con categorías infantil, juvenil y adulta. Trofeo para los tres primeros de cada categoría.
tor02.titulo=Torneo de juegos de mesa
tor02.descripcion=Competición por equipos con juegos como Catan, Carcassonne y Dixit, organizada por eliminatorias.
tor03.titulo=Campeonato de ping-pong
tor03.descripcion=Torneo individual con fase de grupos y eliminatorias. Inscripción abierta a mayores de 12 años.

