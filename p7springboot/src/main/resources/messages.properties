visita.llegar.direccion=Calle de Velázquez, 45 · 28001 Madrid
visita.llegar.metro=Metro: Velázquez (línea 4), a 3 minutos a pie.
visita.llegar.bus=Autobús: líneas 1, 9, 19 y 51.
visita.llegar.parking=Aparcamiento público en la calle Goya, a 200 metros.

visita.reservas.titulo=Reservas y precios
visita.reservas.entrada=La entrada al centro es gratuita.
visita.reservas.talleres=Talleres: 5 € por sesión (gratis para socios).
visita.reservas.antelacion=Las plazas son limitadas: reserva con al menos 48 horas de antelación.
visita.reservas.cancelar=Puedes cancelar sin coste hasta 24 horas antes.

visita.servicios.titulo=Accesibilidad y servicios
visita.servicios.accesible=Edificio accesible con rampa, ascensor y aseos adaptados.
visita.servicios.perros=Se admiten perros guía.
visita.servicios.cafeteria=Cafetería en la planta baja.
visita.servicios.wifi=Wifi gratuito en todo el edificio.

visita.faq.titulo=Preguntas frecuentes
visita.faq.p1=¿Puedo venir con niños?
visita.faq.r1=Sí. Muchas actividades son aptas para familias; lo indicamos en la descripción de cada una.
visita.faq.p2=¿Tengo que llevar material a los talleres?
visita.faq.r2=No, salvo que se indique lo contrario. Los materiales están incluidos.
visita.faq.p3=¿Qué pasa si llego tarde a una excursión?
visita.faq.r3=El autobús sale a la hora indicada. Te recomendamos llegar 15 minutos antes.

visita.contacto.titulo=¿Tienes dudas?
visita.contacto.texto=Llámanos o escríbenos en horario de apertura y te ayudaremos a organizar tu visita.
