# Activities
exc01.titulo=Historic walk through Toledo
exc01.descripcion=Guided tour of the old town, the cathedral and the Santa María la Blanca synagogue, with lunch included.
exc02.titulo=Autumn hike in the mountains
exc02.descripcion=Easy-to-moderate route of about 10 km with a mountain guide who explains the local plants and wildlife.
exc03.titulo=Segovia Aqueduct and Alcázar
exc03.descripcion=Day trip visiting the Aqueduct and the Alcázar, with free time to explore the town centre.
act01.titulo=Watercolour painting workshop
act01.descripcion=Beginners' workshop on basic watercolour techniques. All materials are provided.
act02.titulo=Monthly book club
act02.descripcion=A group discussion of a book chosen the month before, with a moderator.
act03.titulo=Christmas pottery workshop
act03.descripcion=Make clay ornaments and figures for Christmas. Suitable for families.
act04.titulo=Classic film season
act04.descripcion=Screening of a classic film followed by a discussion of the work and its context.
tor01.titulo=Chess tournament by age group
tor01.descripcion=Swiss-system competition with junior, youth and adult sections. Trophies for the top three in each section.
tor02.titulo=Board game tournament
tor02.descripcion=Knockout team competition with games such as Catan, Carcassonne and Dixit.
tor03.titulo=Table tennis championship
tor03.descripcion=Singles tournament with a group stage and knockout rounds. Open to anyone aged 12 and over.

