visita.faq.titulo=Frequently asked questions
visita.faq.p1=Can I bring children?
visita.faq.r1=Yes. Many activities are family-friendly; this is shown in each description.
visita.faq.p2=Do I need to bring materials to workshops?
visita.faq.r2=No, unless stated otherwise. All materials are included.
visita.faq.p3=What if I'm late for an excursion?
visita.faq.r3=The coach leaves on time. We recommend arriving 15 minutes early.

