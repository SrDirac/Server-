# Portfolio: project descriptions
proyecto.portafolio.descripcion=Web application built with Spring Boot and Thymeleaf that presents my résumé and projects. Pages are generated on the server and are available in Spanish and English.
proyecto.migas.descripcion=Visual identity for a fictional bakery called Migas Amigas. It includes a logo, colour palette, typography and a style guide that explains each decision.
proyecto.fisio.descripcion=Website for a physiotherapy clinic built with Bootstrap. It adapts to mobile, tablet and desktop, and presents the clinic services and team.
proyecto.tienda.descripcion=Java desktop application to manage a shop inventory. It connects to a database with JDBC to add, search and update products.
proyecto.dino.descripcion=2D runner video game made with Godot Engine during an introductory game development workshop. The player jumps over obstacles and the speed increases with the score.
proyecto.patrones.descripcion=Class exercises on design patterns in Spring Boot. I apply dependency injection and the Factory pattern to separate responsibilities and make changes easier.
