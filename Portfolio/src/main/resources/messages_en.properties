# ===== teclea page =====
teclea.tituloPagina=teclea · Portfolio
teclea.volver=Back to portfolio
teclea.titular=Spanish touch typing for programmers
teclea.presentacion=teclea is a web app to learn and improve touch typing on the Spanish keyboard (ES-ISO), with modes designed for people who code. It installs as an app, works offline and has no accounts: all data is stored in each person's browser.

teclea.modos=Practice modes
teclea.modo.1.nombre=Learn
teclea.modo.1.texto=It starts with 6 letters (e a o s n r) and unlocks a new one when you reach the target speed with at least 95 % accuracy. The weak letter is practised among letters you already master.
teclea.modo.2.nombre=Time and words
teclea.modo.2.texto=Tests from 15 to 120 seconds or from 10 to 100 words, using the 1k, 5k, 10k or all of the most common Spanish words (about 37,500).
teclea.modo.3.nombre=Review
teclea.modo.3.texto=Practise your lowest-scoring words, where the score is speed × accuracy.
teclea.modo.4.nombre=Book
teclea.modo.4.texto=Type public-domain classic short stories (Bécquer, Clarín, Pardo Bazán and Quiroga) to relax: no timer or metrics, with a bookmark and modernised spelling.
teclea.modo.5.nombre=Code
teclea.modo.5.texto=72 Python and JavaScript snippets across 6 levels (from variables to algorithms), in an editor-like panel with automatic indentation, plus rounds of programming symbols.
teclea.modo.6.nombre=Shortcuts
teclea.modo.6.texto=VS Code and terminal shortcuts for your system (macOS or Windows and Linux), and Vim exercises that compare your keystrokes with the shortest path.
teclea.modo.7.nombre=Goal
teclea.modo.7.texto=A speed goal with a deadline and a guided daily plan (warm-up, weak keys, review and a control test). Every week a report forecasts whether you will make it and adjusts the plan automatically.

teclea.funciones=Key features
teclea.funcion.1.nombre=Detailed statistics
teclea.funcion.1.texto=Per key, per letter pair and per word, with an error map on the keyboard. The original keystrokes are stored, so everything can be recalculated.
teclea.funcion.2.nombre=Hesitation map and confusions
teclea.funcion.2.texto=It marks the letters that take you twice your usual pace and which key you press instead of the right one.
teclea.funcion.3.nombre=On-screen keyboard
teclea.funcion.3.texto=Spanish, US and US international layouts. It highlights the next key with its combinations (dead key, Shift, AltGr) and fits on mobile.
teclea.funcion.4.nombre=Themes and accessibility
teclea.funcion.4.texto=4 themes (paper, minimal, code editor and high contrast), each in light and dark, with contrast checked by a script. 6 free fonts, including OpenDyslexic and Atkinson Hyperlegible.
teclea.funcion.5.nombre=Command palette
teclea.funcion.5.texto=Ctrl+K or ⌘K opens a command search from any page, with recent commands on top.
teclea.funcion.6.nombre=Profile and records
teclea.funcion.6.texto=Local name and avatar, a progress summary, streaks and personal records per mode and duration.
teclea.funcion.7.nombre=Music while you type
teclea.funcion.7.texto=A Spotify or YouTube player in a floating card that dims while you type. Without a link, nothing from third parties is loaded.
teclea.funcion.8.nombre=Offline and backups
teclea.funcion.8.texto=It is an installable PWA that works without internet and updates itself. Data can be exported and imported as a JSON file.

teclea.tecnica=How it is built
teclea.tecnica.intro=It is a single-page application that runs entirely in the browser, with no server of its own. The typing logic is separate from the interface, and the database works in the background so typing stays smooth.
teclea.tec.1.nombre=TypeScript
teclea.tec.1.texto=The language of the whole project. The engine (accents, session, metrics, forecasts) is pure logic with no DOM, easy to test.
teclea.tec.2.nombre=SolidJS and Vite
teclea.tec.2.texto=SolidJS renders the interface with fine-grained reactivity and no virtual DOM, and Vite builds and serves the project.
teclea.tec.3.nombre=IndexedDB (Dexie) in a Web Worker
teclea.tec.3.texto=Stores tests, keystrokes and statistics in the browser. Running on a separate thread, it never slows typing down.
teclea.tec.4.nombre=PWA (vite-plugin-pwa)
teclea.tec.4.texto=A service worker caches the app, words, books and fonts (about 2.4 MB) so it can be used offline.
teclea.tec.5.nombre=Vitest and Playwright
teclea.tec.5.texto=Logic tests and in-browser tests, including a performance test and an offline test.
teclea.tec.6.nombre=Cloudflare Pages
teclea.tec.6.texto=Free static hosting. It is published from the computer with a single command (Wrangler).

teclea.calidad=Quality
teclea.cifra.1.numero=203
teclea.cifra.1.texto=logic tests (Vitest)
teclea.cifra.2.numero=73
teclea.cifra.2.texto=in-browser tests (Playwright)
teclea.cifra.3.numero=0
teclea.cifra.3.texto=long tasks (over 50 ms) with the CPU throttled 4 times
teclea.cifra.4.numero=8
teclea.cifra.4.texto=theme and light or dark combinations with checked contrast

teclea.decisiones=Design decisions
teclea.decision.1=Minimal interface: the bar holds only four main settings, always the same width so nothing moves. Everything secondary lives on the settings page.
teclea.decision.2=Accents taken seriously: ñ is always strict, an extra accent is always an error, and dead keys work on macOS and Windows.
teclea.decision.3=Score = speed × accuracy, with equal weight, so speed stays a priority without ignoring mistakes.
teclea.decision.4=Privacy: no accounts and no server. Everything stays in the browser, and music only loads if the user asks for it.
teclea.decision.5=Book texts are modernised by a script («fué» → «fue») that checks every change against the LibreOffice dictionary, without touching vocabulary or style.

teclea.fases=How it was built
teclea.fases.intro=The project was planned in 7 phases and documented in a log with what was done, the decisions taken and what is pending.
teclea.fase.1=Typing engine: key capture, accents, time and word modes, and metrics.
teclea.fase.2=Per-key statistics, learn mode and review mode.
teclea.fase.3=On-screen keyboard and light and dark themes.
teclea.fase.4=Code mode with Python and JavaScript.
teclea.fase.5=Goal mode with a daily plan and a weekly report.
teclea.fase.6=VS Code, terminal and Vim shortcuts.
teclea.fase.7=PWA, backups and publishing on Cloudflare Pages.

teclea.terceros=Third-party content
teclea.tercero.1=Word list derived from FrequencyWords (Hermit Dave), CC BY-SA 4.0 licence, filtered with the LibreOffice hunspell dictionary.
teclea.tercero.2=Public-domain books from Project Gutenberg, with modernised spelling.
teclea.tercero.3=Fonts under the SIL OFL 1.1 licence and Lucide icons (ISC).
teclea.tercero.4=Official embedded Spotify and YouTube players.
