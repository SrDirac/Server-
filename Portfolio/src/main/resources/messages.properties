# Portfolio: descripciones de los proyectos
proyecto.portafolio.descripcion=Aplicación web hecha con Spring Boot y Thymeleaf que presenta mi currículum y mis proyectos. Las páginas se generan en el servidor y están disponibles en español e inglés.
proyecto.migas.descripcion=Identidad visual para una panadería ficticia llamada Migas Amigas. Incluye logotipo, paleta de colores, tipografías y una guía de estilo que justifica cada decisión.
proyecto.fisio.descripcion=Sitio web para una clínica de fisioterapia maquetado con Bootstrap. Se adapta a móvil, tableta y ordenador, y presenta los servicios y el equipo de la clínica.
proyecto.tienda.descripcion=Aplicación de escritorio en Java para gestionar el inventario de una tienda. Se conecta a una base de datos con JDBC para dar de alta, consultar y actualizar productos.
proyecto.dino.descripcion=Videojuego 2D de tipo runner creado con Godot Engine en un taller de introducción al desarrollo de videojuegos. El jugador salta los obstáculos y la velocidad aumenta con la puntuación.
proyecto.patrones.descripcion=Prácticas de clase sobre patrones de diseño en Spring Boot. Aplico la inyección de dependencias y el patrón Factory para separar responsabilidades y facilitar los cambios.
