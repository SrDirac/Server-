# Portfolio: descripciones de los proyectos
proyecto.portafolio.descripcion=Aplicación web hecha con Spring Boot y Thymeleaf que presenta mi currículum y mis proyectos. Las páginas se generan en el servidor y están disponibles en español e inglés.
proyecto.migas.descripcion=Identidad visual para una panadería ficticia llamada Migas Amigas. Incluye logotipo, paleta de colores, tipografías y una guía de estilo que justifica cada decisión.
proyecto.fisio.descripcion=Sitio web para una clínica de fisioterapia maquetado con Bootstrap. Se adapta a móvil, tableta y ordenador, y presenta los servicios y el equipo de la clínica.
proyecto.tienda.descripcion=Aplicación de escritorio en Java para gestionar el inventario de una tienda. Se conecta a una base de datos con JDBC para dar de alta, consultar y actualizar productos.
proyecto.teclea.descripcion=Aplicación web para practicar mecanografía en español pensada para programadores: modo aprender letra a letra, tests, libros clásicos, código, atajos de VS Code y Vim, y un plan diario con objetivo. Funciona sin conexión y los datos se quedan en el navegador.
proyecto.patrones.descripcion=Prácticas de clase sobre patrones de diseño en Spring Boot. Aplico la inyección de dependencias y el patrón Factory para separar responsabilidades y facilitar los cambios.

# Portfolio: proyecto de interés
portfolio.destacado.etiqueta=Proyecto de interés
portfolio.destacado.resumen=Mecanografía en español para programadores. Siete modos de práctica, estadísticas por tecla, un plan diario que se adapta a tu progreso y funcionamiento sin conexión. Hecha con TypeScript y SolidJS, y publicada en Cloudflare Pages.
portfolio.destacado.saberMas=Conocer el proyecto
portfolio.destacado.probar=Probar teclea

# ===== Página de teclea =====
teclea.tituloPagina=teclea · Portfolio
teclea.volver=Volver al portfolio
teclea.titular=Mecanografía en español para programadores
teclea.presentacion=teclea es una aplicación web para aprender y mejorar la mecanografía con el teclado español (ES-ISO), con modos pensados para quien programa. Se instala como app, funciona sin conexión y no tiene cuentas: todos los datos se guardan en el navegador de cada persona.

teclea.modos=Modos de práctica
teclea.modo.1.nombre=Aprender
teclea.modo.1.texto=Empieza con 6 letras (e a o s n r) y desbloquea una nueva cuando alcanzas la velocidad objetivo con al menos un 95 % de precisión. La letra débil se practica rodeada de letras que ya dominas.
teclea.modo.2.nombre=Tiempo y palabras
teclea.modo.2.texto=Tests de 15 a 120 segundos o de 10 a 100 palabras, con las 1k, 5k, 10k o todas las palabras más usadas del español (unas 37 500).
teclea.modo.3.nombre=Repaso
teclea.modo.3.texto=Practica tus palabras con peor puntuación, calculada como velocidad × precisión.
teclea.modo.4.nombre=Libro
teclea.modo.4.texto=Escribir cuentos clásicos de dominio público (Bécquer, Clarín, Pardo Bazán y Quiroga) para relajarse: sin cronómetro ni métricas, con marcapáginas y ortografía modernizada.
teclea.modo.5.nombre=Código
teclea.modo.5.texto=72 fragmentos de Python y JavaScript en 6 niveles (de variables a algoritmos), en un panel como de editor con sangría automática, más tandas de símbolos de programación.
teclea.modo.6.nombre=Atajos
teclea.modo.6.texto=Atajos de VS Code y de la terminal según el sistema (macOS o Windows y Linux), y ejercicios de Vim que comparan tus pulsaciones con el camino más corto.
teclea.modo.7.nombre=Objetivo
teclea.modo.7.texto=Una meta de velocidad con fecha límite y un plan diario guiado (calentamiento, teclas débiles, repaso y test de control). Cada semana un informe prevé si llegas y ajusta el plan solo.

teclea.funciones=Funciones destacadas
teclea.funcion.1.nombre=Estadísticas detalladas
teclea.funcion.1.texto=Por tecla, por pares de letras y por palabra, con un mapa de errores sobre el teclado. Se guardan las pulsaciones originales, así que se pueden recalcular.
teclea.funcion.2.nombre=Mapa de dudas y confusiones
teclea.funcion.2.texto=Marca las letras en las que tardas el doble de tu ritmo habitual y qué tecla pulsas cuando va otra.
teclea.funcion.3.nombre=Teclado en pantalla
teclea.funcion.3.texto=Distribuciones española, inglesa e internacional. Resalta la siguiente tecla con sus combinaciones (tecla muerta, Mayús, AltGr) y se adapta al móvil.
teclea.funcion.4.nombre=Temas y accesibilidad
teclea.funcion.4.texto=4 temas (papel, minimalista, editor de código y alto contraste), cada uno en claro y oscuro, con el contraste comprobado por un script. 6 fuentes libres, entre ellas OpenDyslexic y Atkinson Hyperlegible.
teclea.funcion.5.nombre=Paleta de comandos
teclea.funcion.5.texto=Ctrl+K o ⌘K abre una búsqueda de comandos desde cualquier página, con los recientes arriba.
teclea.funcion.6.nombre=Perfil y récords
teclea.funcion.6.texto=Nombre y avatar locales, resumen del progreso, rachas y récords personales por modo y duración.
teclea.funcion.7.nombre=Música mientras escribes
teclea.funcion.7.texto=Reproductor de Spotify o YouTube en una tarjeta flotante que se atenúa al escribir. Sin enlace no se carga nada de terceros.
teclea.funcion.8.nombre=Sin conexión y copia de seguridad
teclea.funcion.8.texto=Es una PWA instalable que funciona sin internet y se actualiza sola. Los datos se pueden exportar e importar en un archivo JSON.

teclea.tecnica=Cómo está hecho
teclea.tecnica.intro=Es una aplicación de una sola página que se ejecuta entera en el navegador, sin servidor propio. La lógica de escritura está separada de la interfaz, y la base de datos trabaja en segundo plano para que escribir sea fluido.
teclea.tec.1.nombre=TypeScript
teclea.tec.1.texto=Lenguaje de todo el proyecto. El motor (tildes, sesión, métricas, previsiones) es lógica pura sin DOM, fácil de probar.
teclea.tec.2.nombre=SolidJS y Vite
teclea.tec.2.texto=SolidJS pinta la interfaz con reactividad fina, sin DOM virtual, y Vite compila y sirve el proyecto.
teclea.tec.3.nombre=IndexedDB (Dexie) en un Web Worker
teclea.tec.3.texto=Guarda tests, pulsaciones y estadísticas en el navegador. Al ir en un hilo aparte, no frena la escritura.
teclea.tec.4.nombre=PWA (vite-plugin-pwa)
teclea.tec.4.texto=Service worker que guarda en caché la app, las palabras, los libros y las fuentes (unos 2,4 MB) para usarla sin conexión.
teclea.tec.5.nombre=Vitest y Playwright
teclea.tec.5.texto=Tests de la lógica y tests en el navegador, incluida una prueba de rendimiento y otra de funcionamiento sin conexión.
teclea.tec.6.nombre=Cloudflare Pages
teclea.tec.6.texto=Alojamiento estático gratuito. Se publica con un solo comando (Wrangler) desde el ordenador.

teclea.calidad=Calidad
teclea.cifra.1.numero=203
teclea.cifra.1.texto=tests de lógica (Vitest)
teclea.cifra.2.numero=73
teclea.cifra.2.texto=tests en el navegador (Playwright)
teclea.cifra.3.numero=0
teclea.cifra.3.texto=tareas largas (más de 50 ms) con la CPU 4 veces más lenta
teclea.cifra.4.numero=8
teclea.cifra.4.texto=combinaciones de tema y modo claro u oscuro con el contraste comprobado

teclea.decisiones=Decisiones de diseño
teclea.decision.1=Interfaz minimalista: en la barra solo van cuatro ajustes principales, siempre con el mismo ancho para que nada se mueva. Lo secundario va a la página de ajustes.
teclea.decision.2=Tildes en serio: la ñ siempre es estricta, una tilde de más siempre es error y las teclas muertas funcionan en macOS y en Windows.
teclea.decision.3=Puntuación = velocidad × precisión, con el mismo peso, para que la velocidad siga siendo prioritaria sin olvidar los fallos.
teclea.decision.4=Privacidad: sin cuentas ni servidor. Todo se queda en el navegador y la música solo se carga si la pide el usuario.
teclea.decision.5=Los textos de los libros se modernizan con un script («fué» → «fue») que comprueba cada cambio con el diccionario de LibreOffice, sin tocar el vocabulario ni el estilo.

teclea.fases=Cómo se construyó
teclea.fases.intro=El proyecto se planificó en 7 fases y se documentó en un diario con lo hecho, las decisiones y lo pendiente.
teclea.fase.1=Motor de escritura: captura de teclas, tildes, modos de tiempo y palabras, y métricas.
teclea.fase.2=Estadísticas por tecla, modo aprender y modo repaso.
teclea.fase.3=Teclado en pantalla y temas claro y oscuro.
teclea.fase.4=Modo código con Python y JavaScript.
teclea.fase.5=Modo objetivo con plan diario e informe semanal.
teclea.fase.6=Atajos de VS Code, terminal y Vim.
teclea.fase.7=PWA, copia de seguridad y publicación en Cloudflare Pages.

teclea.terceros=Contenido de terceros
teclea.tercero.1=Lista de palabras derivada de FrequencyWords (Hermit Dave), licencia CC BY-SA 4.0, filtrada con el diccionario hunspell de LibreOffice.
teclea.tercero.2=Libros de dominio público de Project Gutenberg, con la ortografía modernizada.
teclea.tercero.3=Fuentes con licencia SIL OFL 1.1 e iconos de Lucide (ISC).
teclea.tercero.4=Reproductores incrustados oficiales de Spotify y YouTube.
